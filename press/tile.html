<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Codec Studio — tile promocional</title>
<style>
  /* Arte dos tiles da Chrome Web Store. Preenche a borda inteira, sem margens
     brancas, como a loja recomenda. 440×280 (pequeno) e 1400×560 (marquee). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #eaf2ff;
    background: #070b14;
  }

  .tile {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 12% 8%, rgba(62, 240, 212, 0.42), transparent 58%),
      radial-gradient(110% 95% at 88% 92%, rgba(123, 140, 255, 0.46), transparent 60%),
      linear-gradient(150deg, #0a1224, #0e1830 55%, #0a1526);
  }

  /* Grade técnica sutil ao fundo */
  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(233, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(233, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 25%, transparent 78%);
  }

  .mark { width: 74px; height: 74px; position: relative; filter: drop-shadow(0 8px 22px rgba(0,0,0,0.5)); }

  .title {
    position: relative;
    font-size: 38px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(100deg, #7ff5e2, #8fb4ff 60%, #cfa8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    position: relative;
    font-size: 17px;
    font-weight: 500;
    color: rgba(234, 242, 255, 0.72);
    letter-spacing: 0.01em;
  }

  .badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid rgba(62, 240, 212, 0.42);
    background: rgba(62, 240, 212, 0.12);
    font-size: 13px;
    font-weight: 550;
    color: #9ff5e4;
    white-space: nowrap;
  }
  .badge::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #3ef0d4;
    box-shadow: 0 0 10px #3ef0d4;
  }

  /* ---- marquee 1400×560: layout horizontal, tipografia maior ---- */
  @media (min-width: 1000px) {
    .tile { flex-direction: row; gap: 46px; padding: 60px 80px; justify-content: center; }
    .stack { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    .mark { width: 168px; height: 168px; }
    .title { font-size: 82px; }
    .subtitle { font-size: 32px; }
    .badge { font-size: 21px; padding: 11px 22px; }
    .badge::before { width: 10px; height: 10px; }
  }
  @media (max-width: 999px) {
    .stack { display: contents; }
  }
</style>
</head>
<body>
  <div class="tile">
    <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3ef0d4"/>
          <stop offset="55%" stop-color="#38b6f0"/>
          <stop offset="100%" stop-color="#7b8cff"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
      <g fill="none" stroke="#0a1626" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <path d="M34 50h50"/><path d="M72 38l12 12-12 12"/>
        <path d="M94 78H44"/><path d="M56 66L44 78l12 12"/>
      </g>
    </svg>
    <div class="stack">
      <div class="title">Codec Studio</div>
      <div class="subtitle">Base64 · JSON ⇄ Java</div>
      <div class="badge">100% offline · sem permissões</div>
    </div>
  </div>
</body>
</html>
