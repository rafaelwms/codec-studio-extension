<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codec Studio — tile promocional</title>
<style>
  /* Arte dos tiles da Chrome Web Store. Preenche a borda inteira, sem margens
     brancas, como a loja recomenda. 440×280 (pequeno) e 1400×560 (marquee). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    background: #121212;
  }

  .tile {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px;
    overflow: hidden;
    background:
      radial-gradient(90% 90% at 8% 4%, rgba(179, 230, 0, 0.30), transparent 60%),
      radial-gradient(90% 90% at 94% 98%, rgba(179, 230, 0, 0.16), transparent 62%),
      #121212;
  }

  /* Grade técnica sutil ao fundo */
  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 25%, transparent 78%);
  }

  .mark { width: 74px; height: 74px; position: relative; filter: drop-shadow(0 8px 22px rgba(0,0,0,0.5)); }

  .title {
    position: relative;
    font-size: 38px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #ffffff;
  }

  .subtitle {
    position: relative;
    font-size: 17px;
    font-weight: 500;
    color: #c4c9d1;
    letter-spacing: 0.01em;
  }

  .badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid rgba(179, 230, 0, 0.42);
    background: rgba(179, 230, 0, 0.12);
    font-size: 13px;
    font-weight: 550;
    color: #b3e600;
    white-space: nowrap;
  }
  .badge::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #b3e600;
    box-shadow: 0 0 10px #b3e600;
  }

  /* ---- marquee 1400×560: layout horizontal, tipografia maior ---- */
  @media (min-width: 1000px) {
    .tile { flex-direction: row; gap: 46px; padding: 60px 80px; justify-content: center; }
    .stack { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    .mark { width: 168px; height: 168px; }
    .title { font-size: 82px; }
    .subtitle { font-size: 32px; }
    .badge { font-size: 21px; padding: 11px 22px; }
    .badge::before { width: 10px; height: 10px; }
  }
  @media (max-width: 999px) {
    .stack { display: contents; }
  }
</style>
</head>
<body>
  <div class="tile">
    <img class="mark" src="../icons/icon.svg" alt="">
    <div class="stack">
      <div class="title">Codec Studio</div>
      <div class="subtitle">Data, code and files</div>
      <div class="badge">100% offline · no permissions</div>
    </div>
  </div>
</body>
</html>
