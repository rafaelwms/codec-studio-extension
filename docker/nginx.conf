# Servidor da variante "site" do Codec Studio — mesma postura de segurança da
# extensão (CSP restritiva, sem rede de saída), adaptada para um vhost normal.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Não é uma SPA com rotas de cliente: um caminho inexistente é mesmo 404,
    # não deve cair de volta no index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O HTML é quem referencia os demais arquivos, então não pode ficar em cache
    # por muito tempo — senão um deploy novo não chega até quem já visitou.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Os demais arquivos não mudam de nome entre deploys (não há hashing de
    # build), então um teto moderado — não "immutable" — evita servir uma
    # versão desatualizada por muito tempo caso o conteúdo mude.
    location ~* \.(?:css|js|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;

    # Mesmo espírito da CSP declarada no manifest.json da extensão: nenhuma
    # conexão de saída, nenhum script de fora, nenhuma incorporação em iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
